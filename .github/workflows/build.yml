# When CI runs. The job itself is in ci.yml, which release.yml calls too.
#
#   a push to main, a pull request, "Run workflow", every Monday    the tests and the APKs (ci.yml), on ubuntu-latest
#
# Android has no device suite to hold back: its UI tests run on the JVM with Robolectric, never on an emulator. The
# weekly run catches drift in the runner, the JDK and Gradle's downloads.
#
# A push or a pull request that changes only the files below starts nothing: no test, no build step and no script reads
# them. SPEC.md, nthcase/ and art/ are NOT here: the tests read nthcase/ and art/, and SPEC.md is a shared source.
#
# A newer push to the same branch or pull request cancels the older run. "Run workflow" and the weekly run are never
# cancelled by a push, and release.yml has no concurrency at all: a release always runs to its end.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - DESIGN.md
      - LICENSE
      - NOTICE
      - docs/screenshots/**
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - DESIGN.md
      - LICENSE
      - NOTICE
      - docs/screenshots/**
  workflow_dispatch:
  schedule:
    # Monday 03:17 UTC, as the other four Mossgrove apps
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: build-${{ github.run_number }}
