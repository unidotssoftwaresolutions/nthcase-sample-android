# On a v* tag: every check (ci.yml: the tests and the APKs), and only when all of them are green, the GitHub Release
# with the debug-signed APK and SHA256SUMS. A red check publishes nothing.
#
# No concurrency: a release is never cancelled halfway.
#
# No secrets: the APK is signed with the build's own debug key, which is what lets anyone install and test it. The
# token is the run's own GITHUB_TOKEN, and only the release step can write.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  github-release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mossgrove-android-apk
          path: dist
      - name: Create the release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* --repo "$REPO" --title "Mossgrove for Android $TAG" \
            --notes "Debug-signed APK of the Mossgrove sample app, for testing with NthCase. Install it on an emulator or a test phone: adb install mossgrove-android-${TAG}-debug.apk. SHA256SUMS lists its checksum."
